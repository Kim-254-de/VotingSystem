{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Voter | VotingApp</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fff;
            margin: 0;
            padding: 0;
        }
        .header {
            background: #16a34a;
            color: #fff;
            padding: 24px 0 16px 0;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(22,163,74,0.08);
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #fff;
            padding: 32px 24px 24px 24px;
            border-radius: 10px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.10);
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #16a34a;
        }
        .voter-info {
            margin-bottom: 28px;
            font-size: 1.08rem;
        }
        .voter-info p {
            margin: 10px 0;
            color: #222;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #16a34a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(22,163,74,0.08);
            transition: background 0.2s, box-shadow 0.2s;
        }
        button:hover {
            background: #15803d;
            box-shadow: 0 4px 16px rgba(22,163,74,0.13);
        }
        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #16a34a;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            font-size: 1rem;
        }
        .back-home:hover, .back-home:focus { color: #0e7c34; }
    </style>
</head>
<body>
    <div class="header">
        VotingApp
    </div>
    <div class="container">
        <h2>Verify Voter</h2>
        <div class="voter-info">
            <p><strong>Name:</strong> {{ voter.name }}</p>
            <p><strong>Reg no:</strong> {{ voter.national_id }}</p>
        </div>
        <form method="post" id="verifyForm">
    {% csrf_token %}
    <button type="submit" id="verifyDownloadBtn">Verify & Download</button>
   </form>
   <div id="successMessage" style="display: none; text-align: center; margin-top: 20px;">
    <img src="{% static 'Evoting/images/success-check.png' %}" alt="Success" width="100">
    <p style="color: green; font-weight: bold;">Voter Verified Successfully!</p>
</div>


       <a href="{% url 'Evoting:generate_pdf' voter.id %}" id="pdfDownloadLink" target="_blank" style="display: none;"></a>


        <a href="{% url 'Evoting:voter_list' %}" class="back-home"> Back to Voter List</a>
    </div>
    <script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("verifyForm");
    const downloadLink = document.getElementById("pdfDownloadLink");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", function (e) {
        e.preventDefault(); // prevent default form submission

        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        fetch("", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": csrfToken
            },
            body: ""
        }).then(response => {
            if (response.ok) {
                // Show success message
                successMessage.style.display = "block";

                // Wait 1.5 seconds before opening the PDF
                setTimeout(() => {
                    downloadLink.click();
                }, 1500);
            } else {
                alert("Verification failed.");
            }
        }).catch(error => {
            console.error("Error verifying voter:", error);
            alert("An error occurred during verification.");
        });
    });
});
</script>

</body>
</html>
